<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Arcane Decksmith – MTG Sammlung & Deckbuilder</title>

    <meta
      name="description"
      content="Arcane Decksmith – verwalte deine Magic: The Gathering Sammlung, baue Commander- und Standard-Decks und analysiere deine Decks mit KI."
    />

    <meta
      name="theme-color"
      content="#0b1020"
    />

    <meta
      name="application-name"
      content="Arcane Decksmith"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./ad_logo_32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./ad_logo_192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./ad_logo_180.png"
    />

    <!-- Social Media / Link-Vorschau -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Arcane Decksmith – MTG Sammlung & Deckbuilder"
    />

    <meta
      property="og:description"
      content="Verwalte deine Magic: The Gathering Sammlung, baue Commander- und Standard-Decks und analysiere deine Decks mit KI."
    />

    <!-- og:image braucht eine absolute URL und wird beim Build aus VITE_SITE_URL ergänzt (vite.config.ts). -->

    <meta
      property="og:site_name"
      content="Arcane Decksmith"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
